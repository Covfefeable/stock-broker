services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    command: >
      postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'
               -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
               -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
               -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
               -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'
               -c 'statement_timeout=${POSTGRES_STATEMENT_TIMEOUT:-0}'
               -c 'idle_in_transaction_session_timeout=${POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT:-0}'
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./volumes/redis:/data

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    command: >
      uv run --no-sync gunicorn
      --bind "0.0.0.0:8000"
      --workers ${SERVER_WORKER_AMOUNT:-1}
      --worker-class ${SERVER_WORKER_CLASS:-gevent}
      --worker-connections ${SERVER_WORKER_CONNECTIONS:-10}
      --timeout ${GUNICORN_TIMEOUT:-360}
      "app:create_app('production')"
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-604800}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SYNC_TASK_TIMEOUT_SECONDS: ${SYNC_TASK_TIMEOUT_SECONDS:-3600}
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../api
      dockerfile: Dockerfile
    command: uv run --no-sync celery -A app.celery worker --loglevel=info
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-604800}
      RUN_MIGRATIONS: "false"
      SYNC_TASK_TIMEOUT_SECONDS: ${SYNC_TASK_TIMEOUT_SECONDS:-3600}
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker-beat:
    build:
      context: ../api
      dockerfile: Dockerfile
    command: uv run --no-sync celery -A app.celery beat --loglevel=info
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-604800}
      RUN_MIGRATIONS: "false"
      SYNC_TASK_TIMEOUT_SECONDS: ${SYNC_TASK_TIMEOUT_SECONDS:-3600}
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    entrypoint: ["/bin/sh", "/etc/nginx/render-nginx-config.sh"]
    environment:
      ENABLE_SSL: ${ENABLE_SSL:-false}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-server.crt}
      SSL_KEY_FILE: ${SSL_KEY_FILE:-server.key}
    ports:
      - "${EXPOSE_HTTP_PORT:-80}:80"
      - "${EXPOSE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/render-nginx-config.sh:/etc/nginx/render-nginx-config.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
