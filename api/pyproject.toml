[project]
name = "stock-broker-api"
version = "0.1.0"
description = "Flask API service for the AI quantitative strategy platform."
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1.0",
  "flask-cors>=5.0.0",
  "flask-migrate>=4.1.0",
  "flask-sqlalchemy>=3.1.1",
  "gunicorn>=23.0.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
  "gevent>=24.11.1",
]

[dependency-groups]
dev = [
  "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
package = false
